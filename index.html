<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk to Abu’s Voice Bot</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#16181d;--mut:#5b6270;--acc:#4b5df0;--acc2:#e8ebff;--bd:#e2e5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101218;--card:#1a1d26;--ink:#eef0f6;--mut:#9aa1b1;--acc:#7c8bff;--acc2:#262b4a;--bd:#2a2e3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101218;--card:#1a1d26;--ink:#eef0f6;--mut:#9aa1b1;--acc:#7c8bff;--acc2:#262b4a;--bd:#2a2e3b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 4px}p.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
#log{display:flex;flex-direction:column;gap:10px;min-height:120px}
.m{padding:10px 14px;border-radius:14px;max-width:92%;white-space:pre-wrap}
.q{align-self:flex-end;background:var(--acc2)}.a{align-self:flex-start;border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}
#mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:26px;cursor:pointer;flex:none}
#mic.on{animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 0 12px rgba(75,93,240,.25)}}
input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);font:inherit}
button.s{padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font:14px inherit;cursor:pointer}
#st{color:var(--mut);font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Hi, I’m Abu’s voice bot</h1>
<p class="sub">Tap the mic and ask me anything, or tap a question below. I’ll answer out loud, the way Abu would.</p>
<div class="card"><div class="chips" id="chips"></div></div>
<div class="card">
<div id="log"><div class="m a">Hi! I’m Abu. Ask me about my story, my strengths, or where I want to grow.</div></div>
<div class="row"><button id="mic" aria-label="Speak">🎤</button><input id="t" placeholder="…or type a question"><button class="s" id="go">Ask</button></div>
<div id="st"></div>
</div>
<div class="card"><label><input type="checkbox" id="vo" checked style="flex:none;width:auto"> Speak answers aloud</label></div>
</main>
<script>
const A={
"life": "I did my BCA because I’ve always loved tech and wanted to build my own software, first for myself, then something I could publish. I enjoyed studying, so I went on to a master’s. I wanted an MBA at first, but switched to an MCA to stay in tech, and I did both degrees in Madurai. After that I wanted AI and ML work that would last, and I joined Amazon as an ML Data Associate. Last year I was promoted to Associate II, based on performance and an assessment. Now I want to move into AI and ML data work, building AI and data systems.",
"power": "Focus. When I commit to one task, I stay on it until it’s done, get it right, then make it better. That’s how I’ve hit up to 240 percent of my targets with 98 percent quality at Amazon.",
"grow": "First, understanding how AI models really work, so I can build, train and deploy one on my own. Second, combining data and backend work, coding with data and knowledge bases, with precision. Third, putting more energy into learning new technologies, not just polishing what I already know.",
"mis": "People think I pick things up easily, or that I’m good just because I’ve been here longer. Neither is true. I got here by failing and going back to the same process again and again until I beat it. It looks easy because the failures happened behind the scenes.",
"limits": "I want my work recognized as high quality, so when I fail at something, I don’t rest until I understand it and get it right. Then I practice until it’s second nature, like muscle memory. I do that every time.",
"why": "100x is a new company with AI at the center of how it works, and I want to grow with a company like that. I’m especially interested in AI agents because they can now handle detailed tasks from clear instructions. If I join, I’d like to contribute through better training data, clearer task instructions, well-designed workflows, and careful evaluation so the agents become more useful and reliable.",
"leave": "Amazon taught me a lot, but I want to see different work cultures, learn how other companies operate, and try new streams of work. That will broaden my knowledge and round out my profile.",
"weak": "Multitasking across very different kinds of work. Within one field I’m fine, and when I focus on one thing my results are strong. So I don’t fight it. I split the work by field and finish one before starting the next.",
"proj": "After work, I build tools I find interesting. ABot is a chat app that routes across 31 AI models. Linkly is a link shortener with analytics. PriceTracked tracks prices on shopping sites like Amazon India and Flipkart, so I can use it myself without third-party tools. My MCA thesis was a house price prediction project for Bengaluru. I worked with 13,320 housing records and compared different models. Random Forest performed best, with an R squared score of about 0.79 compared with about 0.64 for the linear baselines. I built a Streamlit app and a FastAPI service for the project. I also use AI to help with testing and debugging my personal projects.",
"future": "In three to five years, I want to be a lead in AI or data science. First, I want to go deep: build, train and deploy models end to end, and be the person who gets data and backend work right with precision. Then I want to grow into a senior role where I can lead a team, set the standard, and help us deliver better than other teams. And I want to keep learning new technologies along the way, not just perfecting old ones, so my team stays ahead.",
"hire": "I think I’d be a good fit because I bring practical experience working with machine-learning data, along with a strong focus on quality and consistency. At Amazon, I work with text, image, audio, and video data, evaluate machine-learning outputs, and use SQL and Python for validation. I’ve achieved up to 240 percent of my monthly targets while maintaining more than 98 percent quality, and I’ve shared feedback that helped improve team efficiency. I’m still developing my skills in building AI systems, but I learn through practice, take ownership of my work, and would bring that same focused approach to the AI Agent Team."
};
const R=[[/why should (we|you) hire|why hire|why would we choose you|what makes you (a good fit|the right fit)|why are you the right (person|candidate)|why are you a good candidate|why are you suitable/,"hire"],[/leav|move on|quit|switch jobs|why amazon|current job/,"leave"],[/100x|agent|why (this|us|the) (role|company)|why do you want|why should we/,"why"],[/weakness|weak|multitask/,"weak"],[/project|proud|built|achievement|portfolio|house price|accomplish/,"proj"],[/5 years|five years|3 years|three years|future|years from now|career goal|where do you see/,"future"],[/life story|about (yourself|you)|tell me about|background|who are you|introduce/,"life"],[/superpower|strength|best at|good at/,"power"],[/grow|improve|develop|work on/,"grow"],[/misconception|coworker|colleague|think of you|wrong about/,"mis"],[/boundar|limit|push|challenge|fail|pressure/,"limits"]];
const $=id=>document.getElementById(id),log=$("log"),st=$("st");
const Q=["What should we know about your life story?","What’s your #1 superpower?","What are the top 3 areas you’d like to grow in?","What misconception do your coworkers have about you?","How do you push your boundaries and limits?","Why do you want to join 100x?","Why do you want to leave Amazon?","What is one weakness you are working on?","Tell me about your projects.","Where do you see yourself in 3 to 5 years?","Why should we hire you?"];
Q.forEach(q=>{const b=document.createElement("button");b.textContent=q;b.onclick=()=>ask(q);$("chips").appendChild(b)});
function add(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);d.scrollIntoView({block:"nearest"});return d}
function speak(t){try{if(!$("vo").checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=speechSynthesis.getVoices().find(x=>/en-IN/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));if(v)u.voice=v;u.rate=1;speechSynthesis.speak(u)}catch(e){}}
let busy=false;
async function ask(q){q=(q||"").trim();if(!q||busy)return;busy=true;$("t").value="";add("q",q);const l=q.toLowerCase();let key=null;for(const[r,k]of R)if(r.test(l)){key=k;break}
let out=null;
if(key){out=A[key];add("a",out)}
else{
 const d=add("a","Thinking…");
 try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q})});if(!r.ok)throw 0;out=(await r.json()).text;d.textContent=out}
 catch(e){out="That’s a good one. I’d love to talk it through live. In short: I stay focused, learn from every failure, and I’m aiming at AI and ML data work. Try asking about my story, strengths, growth areas, or how I push my limits.";d.textContent=out}
}
speak(out);busy=false}
$("go").onclick=()=>ask($("t").value);$("t").onkeydown=e=>{if(e.key==="Enter")ask($("t").value)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
if(!SR){$("mic").style.display="none";st.textContent="Voice input isn’t supported in this browser. Type or tap a question. Chrome works best."}
else $("mic").onclick=()=>{if(rec){rec.stop();return}try{rec=new SR();rec.lang="en-IN";rec.interimResults=false;rec.onstart=()=>{$("mic").classList.add("on");st.textContent="Listening…"};
rec.onresult=e=>ask(e.results[0][0].transcript);rec.onerror=e=>{st.textContent=e.error==="not-allowed"?"Mic is blocked. Allow microphone access, or type your question.":"Couldn’t hear that. Try again or type."};
rec.onend=()=>{$("mic").classList.remove("on");rec=null;if(st.textContent==="Listening…")st.textContent=""};rec.start()}catch(e){st.textContent="Mic unavailable. Please type your question.";rec=null}};
</script>
</body>
</html>
